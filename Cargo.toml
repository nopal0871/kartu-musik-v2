[package]
name = "kartu-musik"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo = { version = "0.11", features = ["events","timers","file","storage"] }
console_error_panic_hook = "0.1"
web-time = "1"
linkme = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window","Document","Element","HtmlElement","HtmlCanvasElement",
  "HtmlInputElement","HtmlAudioElement","HtmlVideoElement","HtmlButtonElement",
  "HtmlImageElement","HtmlDivElement",
  "CanvasRenderingContext2d","CanvasGradient","TextMetrics",
  "ImageBitmap","Blob","BlobEvent","BlobPropertyBag","Url","File","FileList","FileReader",
  "MediaStream","MediaStreamTrack","MediaRecorder","MediaRecorderOptions",
  "AudioContext","AudioBuffer","AudioBufferSourceNode","AudioNode",
  "MediaStreamAudioDestinationNode","AnalyserNode","MediaStreamAudioSourceNode",
  "Event","MouseEvent","PointerEvent","WheelEvent"
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
