[package]
name = "kartu-musik-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "HtmlInputElement", "HtmlAudioElement", "HtmlVideoElement", "HtmlButtonElement",
  "HtmlImageElement", "HtmlDivElement",
  "CanvasRenderingContext2d", "CanvasGradient", "TextMetrics",
  "ImageBitmap", "Blob", "BlobEvent", "BlobPropertyBag", "Url", "File", "FileList",
  "FileReader", "MediaStream", "MediaStreamTrack", "MediaRecorder",
  "MediaRecorderOptions", "AudioContext", "AudioBuffer", "AudioBufferSourceNode",
  "AudioNode", "MediaStreamAudioDestinationNode", "AnalyserNode",
  "MediaStreamAudioSourceNode", "MediaElementAudioSourceNode", "HtmlMediaElement",
  "AudioDestinationNode", "Event", "MouseEvent", "PointerEvent", "WheelEvent"
]
